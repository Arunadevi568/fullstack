<!DOCTYPE html>
<html>
<head>
    <title>CSS Profile Card</title>

    <style>
        body{
            margin:0;
            padding:0;
            background:linear-gradient(to right,#74ebd5,#9face6);
            font-family:Arial,sans-serif;
        }

        .card{
            width:350px;
            margin:80px auto;
            background:white;
            border-radius:20px;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
            text-align:center;
            padding:20px;
            transition:0.5s;
        }

        .card:hover{
            transform:scale(1.05);
            box-shadow:0 15px 30px rgba(0,0,0,0.5);
        }

        img{
            width:140px;
            height:140px;
            border-radius:50%;
            border:5px solid royalblue;
        }

        h1{
            color:navy;
            text-shadow:2px 2px 5px gray;
        }

        h3{
            color:#555;
        }

        p{
            color:#333;
            font-size:18px;
        }

        .btn{
            display:inline-block;
            margin-top:15px;
            padding:10px 25px;
            background:royalblue;
            color:white;
            text-decoration:none;
            border-radius:30px;
            transition:0.4s;
        }

        .btn:hover{
            background:darkblue;
            letter-spacing:2px;
        }
    </style>

</head>

<body>

<div class="card">

    <img src="https://via.placeholder.com/140" alt="Student">

    <h1>Aruna Devi</h1>

    <h3>Artificial Intelligence & Machine Learning</h3>

    <p>
        Passionate about AI, Web Development and
        creating innovative projects using HTML, CSS and Python.
    </p>

    <a href="#" class="btn">View Profile</a>

</div>

</body>
</html>
